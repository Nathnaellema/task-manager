<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager Pro</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      max-width: 620px;
      margin: 50px auto;
      padding: 20px;
    }
    h2 { text-align: center; color: #fff; margin-bottom: 24px; }

    .dashboard-card {
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .stats-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background-color: #2d2d2d;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00adb5, #00fff2);
      transition: width 0.4s ease-in-out;
    }

    form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="text"] {
      flex: 2; min-width: 160px; padding: 10px; border-radius: 6px; border: 1px solid #333;
      background-color: #1e1e1e; color: #fff; outline: none;
    }
    input[type="date"], input[type="time"], select {
      flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333;
      background-color: #1e1e1e; color: #fff; cursor: pointer; outline: none;
    }
    button {
      padding: 10px 16px; border-radius: 6px; border: none;
      cursor: pointer; font-weight: bold;
    }
    .add-btn { background-color: #00adb5; color: #fff; }

    .controls-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    .filter-container { display: flex; gap: 8px; }
    .filter-btn {
      background-color: #1e1e1e; color: #aaa; border: 1px solid #333;
      padding: 6px 14px; border-radius: 16px; font-size: 13px;
    }
    .filter-btn.active {
      background-color: #00adb5; color: #fff; border-color: #00adb5;
    }
    .clear-btn {
      background-color: transparent; color: #888; border: 1px solid #333;
      padding: 6px 12px; border-radius: 16px; font-size: 12px;
    }
    .clear-btn:hover { color: #e63946; border-color: #e63946; }

    ul { list-style: none; padding: 0; }
    li {
      background-color: #1e1e1e; border: 1px solid #2d2d2d;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; margin-bottom: 10px; border-radius: 6px;
    }
    .task-content { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .task-content input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .completed { text-decoration: line-through; color: #777; }
    
    .badge {
      font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px;
      text-transform: uppercase;
    }
    .badge-high { background-color: #e63946; color: #fff; }
    .badge-medium { background-color: #ffb703; color: #000; }
    .badge-low { background-color: #2a9d8f; color: #fff; }
    .badge-overdue { background-color: #d90429; color: #fff; }
    .date-text { font-size: 12px; color: #aaa; }

    .actions { display: flex; gap: 6px; }
    .edit-btn { background-color: #ffb703; color: #000; }
    .delete-btn { background-color: #e63946; color: #fff; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: #666; font-size: 15px;
    }
    .empty-state span { font-size: 36px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>⚡ Task Manager</h2>

  <div class="dashboard-card">
    <div class="stats-header">
      <span>Progress</span>
      <span id="statsText">0 of 0 completed</span>
    </div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <form id="taskForm">
    <input type="text" id="taskTitle" placeholder="Enter task..." required />
    <input type="date" id="taskDueDate" />
    <input type="time" id="taskDueTime" />
    <select id="taskPriority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit" class="add-btn">Add</button>
  </form>

  <div class="controls-bar">
    <div class="filter-container">
      <button class="filter-btn active" onclick="setFilter('all')">All</button>
      <button class="filter-btn" onclick="setFilter('active')">Active</button>
      <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
    </div>
    <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>
  </div>

  <ul id="taskList"></ul>

  <script>
    const form = document.getElementById('taskForm');
    const input = document.getElementById('taskTitle');
    const dueDateInput = document.getElementById('taskDueDate');
    const dueTimeInput = document.getElementById('taskDueTime');
    const prioritySelect = document.getElementById('taskPriority');
    const list = document.getElementById('taskList');
    const statsText = document.getElementById('statsText');
    const progressFill = document.getElementById('progressFill');
    let currentFilter = 'all';
    let allTasksCache = [];

    // Request desktop notification permissions
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    // Play a chime sound using Web Audio API
    function playAlarmSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1); // 1-second chime
    }

    // Check alarm status every 10 seconds
    setInterval(() => {
      const now = new Date();
      
      allTasksCache.forEach(async task => {
        if (!task.completed && !task.alarmTriggered && task.dueDate && task.dueTime) {
          const taskDeadline = new Date(`${task.dueDate}T${task.dueTime}`);
          
          if (now >= taskDeadline) {
            playAlarmSound();
            
            if ("Notification" in window && Notification.permission === "granted") {
              new Notification("⏰ Task Alarm!", {
                body: `Time to complete: ${task.title}`
              });
            } else {
              alert(`⏰ ALARM: ${task.title}`);
            }

            // Flag alarm as triggered so it doesn't ring continuously
            await fetch(`/api/tasks/${task.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ alarmTriggered: true })
            });
            
            loadTasks();
          }
        }
      });
    }, 10000);

    async function loadTasks() {
      const res = await fetch('/api/tasks');
      allTasksCache = await res.json();

      updateDashboard(allTasksCache);

      let displayTasks = allTasksCache;
      if (currentFilter === 'active') {
        displayTasks = allTasksCache.filter(task => !task.completed);
      } else if (currentFilter === 'completed') {
        displayTasks = allTasksCache.filter(task => task.completed);
      }

      if (displayTasks.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span>🎉</span>
            No tasks found! You're all caught up.
          </div>
        `;
        return;
      }

      const now = new Date();

      list.innerHTML = displayTasks.map(task => {
        let isOverdue = false;
        if (task.dueDate && !task.completed) {
          const deadline = new Date(`${task.dueDate}T${task.dueTime || '23:59'}`);
          isOverdue = now > deadline;
        }

        return `
          <li>
            <div class="task-content">
              <input 
                type="checkbox" 
                ${task.completed ? 'checked' : ''} 
                onchange="toggleTask(${task.id}, ${!task.completed})"
              />
              <span class="${task.completed ? 'completed' : ''}">${task.title}</span>
              <span class="badge badge-${task.priority || 'medium'}">${task.priority || 'medium'}</span>
              ${task.dueDate ? `<span class="date-text">📅 ${task.dueDate} ${task.dueTime || ''}</span>` : ''}
              ${isOverdue ? `<span class="badge badge-overdue">Overdue</span>` : ''}
            </div>
            <div class="actions">
              <button class="edit-btn" onclick="editTask(${task.id}, '${task.title}')">Edit</button>
              <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
            </div>
          </li>
        `;
      }).join('');
    }

    function updateDashboard(tasks) {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      statsText.textContent = `${completed} of ${total} completed (${percent}%)`;
      progressFill.style.width = `${percent}%`;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase() === filter) {
          btn.classList.add('active');
        }
      });
      loadTasks();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          title: input.value,
          dueDate: dueDateInput.value,
          dueTime: dueTimeInput.value,
          priority: prioritySelect.value
        })
      });
      input.value = '';
      dueDateInput.value = '';
      dueTimeInput.value = '';
      loadTasks();
    });

    async function toggleTask(id, completed) {
      await fetch(`/api/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      loadTasks();
    }

    async function editTask(id, currentTitle) {
      const newTitle = prompt('Update task title:', currentTitle);
      if (newTitle) {
        await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle })
        });
        loadTasks();
      }
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    async function clearCompleted() {
      await fetch('/api/tasks-clear-completed', { method: 'DELETE' });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
